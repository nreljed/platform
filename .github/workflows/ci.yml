name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  validate:
    runs-on: ${{ vars.RUNNER_CI || 'self-hosted' }}
    defaults:
      run:
        shell: bash
    env:
      COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GH_TOKEN }}"}}'
    steps:
      - uses: actions/checkout@v7

      - name: Lint PHP
        shell: bash
        run: find src tests -name "*.php" -print0 | xargs -0 -n1 php -l > /dev/null && echo "lint OK"

      - name: Install dependencies
        shell: bash
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run tests
        shell: bash
        run: php vendor/phpunit/phpunit/phpunit

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ${{ vars.RUNNER_CI || 'self-hosted' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          if gh release view "$TAG" -R nreljed/dashboard-core > /dev/null 2>&1; then
            echo "Release $TAG already exists — skipping"
          else
            gh release create "$TAG" --title "dashboard-core $TAG" --generate-notes -R nreljed/dashboard-core
          fi

      - name: Notify consumers (core-updated)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          for repo in nreljed/laravel nreljed/laravel.shop nreljed/laravel.booking; do
            gh api -X POST "repos/$repo/dispatches" \
              -f event_type=core-updated \
              -f client_payload[version]="${{ github.ref_name }}" \
              -f client_payload[repo]=nreljed/dashboard-core \
              || echo "dispatch to $repo failed (continuing)"
          done
