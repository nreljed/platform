name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  validate:
    runs-on: [self-hosted, local]
    steps:
      - uses: actions/checkout@v4

      - name: Lint PHP
        shell: bash
        run: find src tests -name "*.php" -print0 | xargs -0 -n1 php -l > /dev/null && echo "lint OK"

      - name: Install dependencies
        shell: bash
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run tests
        shell: bash
        run: php vendor/phpunit/phpunit/phpunit

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: [self-hosted, local]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: gh release create "${{ github.ref_name }}" --title "dashboard-core ${{ github.ref_name }}" --generate-notes -R nreljed/dashboard-core

      - name: Notify consumers (core-updated)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          for repo in nreljed/laravel nreljed/laravel.shop nreljed/laravel.booking; do
            gh api -X POST "repos/$repo/dispatches" \
              -f event_type=core-updated \
              -f client_payload[version]="${{ github.ref_name }}" \
              -f client_payload[repo]=nreljed/dashboard-core \
              || echo "dispatch to $repo failed (continuing)"
          done
